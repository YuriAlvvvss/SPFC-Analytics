name: Atualizar Jogos SPFC (ESPN)

on:
  schedule:
    # Segundas e sextas-feiras às 08:00 BRT (11:00 UTC)
    - cron: "0 11 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-jogos-spfc
  cancel-in-progress: false

jobs:
  atualizar-dados:
    name: Carga incremental via API ESPN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Executar atualização incremental (ESPN)
        run: python etl/atualizar_temporada.py

      - name: Quality Gate — Validar qualidade dos dados (pytest)
        run: pytest -v

      - name: Commit e push se houver alterações em docs/data/
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/
            git commit -m "chore(data): atualiza jogos SPFC via ESPN"
            git push
          else
            echo "Nenhuma alteração real em docs/data/. Nada a commitar."
          fi

name: Atualizar Dados do Brasileirão (API + ESPN + Deploy)

on:
  schedule:
    # Todos os dias às 03:00 BRT (06:00 UTC) e às 12:00 BRT (15:00 UTC)
    - cron: "0 6,15 * * *"
  workflow_dispatch:

jobs:
  update-data:
    name: Coletar API, rodar ETL, validar e commitar
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: update-data
      cancel-in-progress: false

    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      - name: Checkout do repositório (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validar Secret FOOTBALL_DATA_API_KEY (fail-fast)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "${FOOTBALL_DATA_API_KEY//[[:space:]]/}" ]; then
            echo "::error::Secret FOOTBALL_DATA_API_KEY não encontrado ou vazio. Crie o Secret em Settings > Secrets and variables > Actions > New repository secret antes de executar este workflow."
            exit 1
          fi
          echo "Secret FOOTBALL_DATA_API_KEY validado com sucesso."

      - name: Coletar jogos e próximo jogo via API football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python etl/atualizar_jogos_api.py

      - name: Enriquecer temporada atual via API ESPN (gols, cartões e estatísticas)
        id: espn_enrichment
        continue-on-error: true
        run: python etl/atualizar_temporada.py

      - name: Registrar alerta de falha no enriquecimento via ESPN
        if: steps.espn_enrichment.outcome == 'failure'
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TIMESTAMP_BRT="$(TZ='America/Sao_Paulo' date +'%Y-%m-%d %H:%M:%S %Z (UTC%z)')"
          TIMESTAMP_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          echo "::warning title=Falha no enriquecimento via API ESPN::etl/atualizar_temporada.py falhou em ${TIMESTAMP_BRT}. O pipeline seguiu com football-data.org (continue-on-error: true); consulte o Job Summary para detalhes e passos de investigação."

          {
            printf '## ⚠️ Alerta: Falha no enriquecimento via API ESPN\n\n'
            printf 'A etapa `espn_enrichment` (`python etl/atualizar_temporada.py`) falhou nesta execução e foi tolerada via `continue-on-error: true` para preservar a continuidade do pipeline diário.\n\n'
            printf '### Contexto da Ocorrência\n'
            printf '| Campo | Valor |\n'
            printf '| --- | --- |\n'
            printf '| **Data/Hora (BRT)** | `%s` |\n' "$TIMESTAMP_BRT"
            printf '| **Data/Hora (UTC)** | `%s` |\n' "$TIMESTAMP_UTC"
            printf '| **Workflow** | %s |\n' "$WORKFLOW_NAME"
            printf '| **Evento** | `%s` |\n' "$EVENT_NAME"
            printf '| **Execução** | [#%s (tentativa %s)](%s) |\n' "$RUN_ID" "$RUN_ATTEMPT" "$RUN_URL"
            printf '| **Etapa / Script** | `espn_enrichment` → `etl/atualizar_temporada.py` |\n\n'
          } >> "$GITHUB_STEP_SUMMARY"

          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Impacto
          - **Pipeline principal preservado:** a ingestão de placares e próximo jogo via `football-data.org`, o merge determinístico (`etl/processar_dados.py`), o Quality Gate (`pytest`) e o deploy continuam normalmente.
          - **Enriquecimento adiado:** detalhes da temporada atual (**gols/artilheiros, cartões/expulsões, formação e estatísticas técnicas** via API pública da ESPN `bra.1`) não foram atualizados nesta execução.
          - **Atenção à recorrência:** se este alerta se repetir em execuções consecutivas, partidas recentes permanecerão sem detalhamento fino até o diagnóstico.

          ### Como Investigar
          1. Inspecione os logs da etapa **"Enriquecer temporada atual via API ESPN (gols, cartões e estatísticas)"** nesta execução procurando timeouts, erros HTTP (`403`/`429`/`5xx`), regressão de contagem ou alterações de payload da ESPN (`site.api.espn.com/apis/site/v2/sports/soccer/bra.1`).
          2. Reproduza localmente com `python etl/atualizar_temporada.py` (ou `python etl/atualizar_temporada.py --force-refresh` para ignorar o cache local) e valide os dicionários `MAPA_TIMES`, `MAPA_ATLETAS` e `MAPA_ARENAS`.
          3. Em caso de instabilidade transitória já normalizada, aguarde a próxima execução agendada (`03h00` / `12h00` BRT) ou acione manualmente o workflow **Atualizar Jogos SPFC (ESPN — Manual)** (`.github/workflows/atualizar-jogos.yml`).
          EOF

      - name: Executar ETL e merge determinístico
        run: python etl/processar_dados.py

      - name: Quality Gate — Validar qualidade dos dados (pytest)
        run: pytest -v

      - name: Verificar alterações reais nos arquivos de dados
        id: check_changes
        run: |
          CHANGED="$(git status --porcelain -- \
            data/jogos_api_brasileirao.json \
            docs/data/spfc_pontos_corridos.json \
            docs/data/meta.json \
            docs/data/proximo_jogo.json)"
          if [ -n "$CHANGED" ]; then
            echo "Alterações reais detectadas:"
            echo "$CHANGED"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhuma alteração real nos arquivos de dados. Nenhum commit necessário."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar e enviar alterações de dados para main
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/jogos_api_brasileirao.json \
            docs/data/spfc_pontos_corridos.json \
            docs/data/meta.json \
            docs/data/proximo_jogo.json \
            docs/sitemap.xml
          git commit -m "chore(data): atualiza jogos do Brasileirão (API + ESPN)"
          git pull --rebase origin main
          git push origin main

  build:
    name: Preparar artefato otimizado do GitHub Pages
    needs: update-data
    if: needs.update-data.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout do repositório (main atualizada)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar esbuild
        run: npm install --no-audit --no-fund

      - name: Gerar build otimizado (minificação + cache-busting)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato do Pages (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy no GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

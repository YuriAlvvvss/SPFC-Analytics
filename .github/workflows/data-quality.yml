name: Qualidade de Dados (Data Quality)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-quality:
    name: Validar qualidade dos dados (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Executar suíte de qualidade de dados
        run: pytest -v
